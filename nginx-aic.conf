# /etc/nginx/sites-available/aic  (pa ln -s u sites-enabled, i rm default)
#
# certbot ovome sam dopisuje `listen 443 ssl`, putanje do sertifikata i
# preusmerenje sa 80 -- pokrece se POSLE kopiranja ovog fajla:
#   sudo certbot --nginx -d <ip-sa-crticama>.sslip.io
#
# Ogranicenje broja zahteva ide u /etc/nginx/nginx.conf, u `http` blok:
#   limit_req_zone $binary_remote_addr zone=prijava:1m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name <ip-sa-crticama>.sslip.io;   # npr. 203-0-113-7.sslip.io

    # Ime sajta se nikad ne salje trecoj strani, ni preko linkova u tudje
    # sajtove u karticama agencija.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Ista vrednost stoji i u `aic/sajt.py` (`CSP`), jer statiku ovde sluzi
    # nginx i do Pythona ne stigne. Ako se tamo menja, menja se i ovde.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    # certbot ovo dopunjava; HSTS ima smisla tek kad TLS radi.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 16k;          # nijedna ruta ne prima vise
    server_tokens off;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 512;

    # Ljuska aplikacije. Ne nosi nijedan podatak -- svi idu kroz /api/, i tamo
    # je kapija. Ako ipak zelis da ni ljuska ne bude javna, obrisi ovaj blok i
    # `location /` prepusti proxy_pass-u ispod; Python sluzi statiku isto.
    root /opt/aic-sajt/web/dist;
    location / {
        try_files $uri /index.html;    # SPA: ruta je u hash-u
        # "no-cache" nije "no-store": pregledac cuva fajl ali svaki put pita
        # da li se promenio. Posle deploy-a nema starog app.js, a nema ni
        # ponovnog skidanja 32 KB pri svakom kliku.
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8770;
        # Keep-alive prema Pythonu: bez ova dva reda nginx svakom zahtevu pravi
        # novu TCP vezu ka gore.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Od ovog zaglavlja zavisi `Secure` na kolacicu i adresa u brojacu
        # neuspelih prijava. Postavlja se OVDE, pa vrednost koju posalje
        # klijent ne moze da prodje.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    # Nagadjanje lozinke: 1 zahtev u sekundi po adresi, uz kratak nalet.
    # Druga polovina brane je u kodu -- scrypt od ~60 ms i osam pokusaja na
    # petnaest minuta po paru (mejl, IP). Vidi `nalog.zakljucan`.
    location = /api/prijava {
        limit_req zone=prijava burst=5 nodelay;
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
